# ============================================
# Configurações do Sistema de Detecção de EPI
# ============================================

# --- Câmera / Fonte de Vídeo ---
camera:
  source: 0                # 0 = webcam padrão, "rtsp://..." para câmera IP, "video.mp4" para arquivo
  width: 1280
  height: 720
  fps: 30
  reconnect_delay: 5       # Segundos para tentar reconectar se perder conexão

# --- Modelo de Detecção ---
detection:
  backend: "pose"               # "pose" (YOLO-Pose anatômico para uniforme RF, luvas e capacete) ou "yolo"
  model_path: "yolov8n-pose.pt" # yolov8n-pose.pt para Pose ou models/best.pt para legado
  confidence: 0.20              # Threshold de confiança mínima
  iou_threshold: 0.45        # Threshold de IoU para NMS
  skip_frames: 2             # Processar a cada N frames (1 = todos)
  track: true                # Habilitar tracking de objetos (ByteTrack)
  imgsz: 640                 # Tamanho da imagem para inferência

# --- Regras de Conformidade ---
compliance:
  min_violation_frames: 3    # Frames consecutivos para confirmar uma violação (ideal para 15-30 FPS)
  required_ppe:              # Lista de EPIs obrigatórios a verificar
    - helmet
    - gloves
    - uniform_rf
    - vest
  violation_classes:          # Classes que indicam AUSÊNCIA de EPI
    - no_helmet
    - no_gloves
    - no_uniform_rf
    - no_vest

# --- Sistema de Alertas ---
alerts:
  save_images: true          # Salvar imagens de violações localmente
  save_dir: "alertas"        # Pasta para salvar imagens
  send_email: false          # Enviar alertas por email (configure o .env primeiro)
  cooldown_seconds: 60       # Intervalo mínimo entre alertas do mesmo tipo/pessoa
  image_quality: 85          # Qualidade JPEG das imagens salvas (1-100)

# --- Exibição ---
display:
  show_window: true          # Mostrar janela com vídeo anotado
  bbox_thickness: 2          # Espessura das caixas delimitadoras

# --- Processamento de Gravações MP4 (Placa > Data > Vídeo) ---
video_batch:
  input_dir: "gravacoes"     # Pasta raiz das gravações
  file_extensions:           # Extensões suportadas (.265 nativo, .mp4, etc.)
    - ".265"
    - ".h265"
    - ".hevc"
    - ".mp4"
    - ".avi"
    - ".mkv"
  skip_frames: 3             # Analisar a cada N frames (aumenta velocidade)
  report_csv: "relatorio_infracoes.csv"  # Relatório consolidado de infrações
  processed_db: "videos_processados.json" # Controle de vídeos já analisados
  watch_interval: 30         # Segundos entre checagens no modo contínuo (--watch)

# --- Aprendizado Ativo (coleta automática de frames para retreino) ---
active_learning:
  enabled: true                       # Coletar frames relevantes durante as análises
  output_dir: "datasets/coleta_ativa" # pendentes/ aprovados/ rejeitados/
  uncertain_min: 0.30                 # Faixa de confiança considerada "duvidosa"
  uncertain_max: 0.60
  random_rate: 0.02                   # 2% de frames aleatórios (evita dataset viciado)
  min_frame_gap: 30                   # Intervalo mínimo (frames do vídeo) entre coletas
  max_per_video: 150                  # Limite de amostras por vídeo/câmera
  max_pending: 5000                   # Para de coletar se houver muitas pendentes de revisão
  dedup_threshold: 6                  # Distância de hash para considerar frames repetidos


